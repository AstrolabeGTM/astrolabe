# yaml-language-server: $schema=../../schemas/automations.schema.json
# Try it: Signals → "Add a signal by hand" with type "referral" for a demo person.
# This automation then starts the intro sequence for them.
- id: referral-intro
  trigger: {signal: manual.referral}
  action: {sequence: intro}

- id: stuck-after-signup
  trigger: {stage_stuck: {stage: signed_up, for: 2d}}
  action: {sequence: activation-help}

# Pipeline automations: an account entering a stage, or sitting in one.
- id: qualified-trial-plan
  trigger: {account_stage: qualified}
  action: {task: "Send a one-page trial plan with two kickoff dates"}

- id: contacted-no-answer
  trigger: {account_stuck: {stage: contacted, for: 14d}}
  action: {task: "No answer for two weeks: try another person, or pause it with a revisit date"}

# DEMO DATA: example conversation notes, loaded once in sandbox mode. Days
# count back from the day the demo starts. People must be in demo-people.csv.
- person: sam.lee@acme.example
  account: acme.example
  days_ago: 3
  channel: call
  duration_minutes: 30
  summary: "Walked through the first flaky-test report on the payments repo; Sam found two quarantine candidates."
  their_words: "I stopped re-running CI by hand after the second day. I would miss this on Monday morning."
  problem: "Checkout tests fail about once a day and block merges."
  current_approach: "Re-run failed jobs by hand; a quarantine list in a wiki page."
  next_step: "Review the second report with Sam on Friday."
  pmf:
    answer: very_disappointed
    used_two_weeks: true
    alternative: "Back to the wiki page and re-running jobs, I guess."
    who_else: "Anyone on our platform team who owns CI."
  pricing:
    - offer: "Team plan, $29 per month"
      replaces: "A paid CI minutes top-up we buy every month"
      approver: "Our engineering manager"
      buying_process: card
      reaction: "That is less than the CI minutes we waste on re-runs."


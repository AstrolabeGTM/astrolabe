# DEMO DATA: example accounts for the pipeline in product.yaml, loaded once
# in sandbox mode. Days count back from the day the demo starts.
- company: acme.example
  name: Acme
  stage: trial
  days_in_stage: 4
  evidence: "Sam agreed a two-week trial on the payments repo"
  next_action: "Review the first flaky-test report with Sam"
  due_in_days: 1
  people: {sam.lee@acme.example: champion}
  checks:
    pain: "yes: Checkout tests fail about once a day and block merges"
    champion: "yes: Sam will run the trial and present the result"
    timing: "yes: Payment release freeze starts in December"
    budget: "unknown: Not asked yet"
  goal: "Merge payment changes without re-running CI three times"
  timing: "Release freeze in December; the flaky suite has to be green before then"
  baseline: "Re-run failed jobs by hand; a quarantine list in a wiki page"


# trigger -> when -> action (sales: plays). Each trigger runs once; skips say why.
# GitHub signals become a task to help in the thread, not a cold email:
# GitHub's Acceptable Use Policies forbid emailing people from GitHub data.
# Astrolabe also refuses to email anyone it only knows from GitHub.
- id: pain-issue-help
  notes: "People who opened an issue about the problem. Help in the issue itself; max 10/day."
  trigger: {signal: github.issue_pain}
  when: {min_fit: 40, not_contacted_within: 30d}
  action: {task: "Answer in the issue if you can genuinely help", draft: true}
  limit_per_day: 10

- id: community-thread
  trigger: {signal: community.thread}
  action: {task: "Reply if you can genuinely help", draft: true}
  limit_per_day: 5

- id: stuck-after-signup
  trigger: {stage_stuck: {stage: signed_up, for: 3d}}
  action: {sequence: activation-help}
